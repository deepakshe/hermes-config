name: Sync Config
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */12 * * *'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate Config
        run: |
          if [ -f config.yaml ]; then
            echo "config.yaml found, validation passed."
          else
            echo "config.yaml missing!" && exit 1
          fi
