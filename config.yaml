model:
  default: gemini/gemini-2.5-flash
  provider: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  aliases:
    gemini-flash: gemini/gemini-2.5-flash
    gemini-pro: gemini/gemini-2.5-pro
    groq-llama: groq/llama-3.3-70b-versatile
    groq-gptoss: groq/openai/gpt-oss-120b
    hf-llama: huggingface/meta-llama/llama-3.1-8b-instruct
    hf-qwen: huggingface/qwen/qwen2.5-72b-instruct
    or-llama: openrouter/meta-llama/llama-3.3-70b-instruct
    or-gptoss: openrouter/openai/gpt-oss-120b
    kilo-nemotron: kilo-ai/nvidia/nemotron-3-ultra-550b-a55b:free
    fw-llama: fireworks/meta-llama/llama-3.1-8b-instruct
    local-mistral: custom/mistral:latest
fallback_providers:
  - provider: custom
    model: mistral:latest
    base_url: http://localhost:11434
    key_env: HERMES_CUSTOM_LOCALHOST_11434_API_KEY
    trigger_on:
      - 429
      - 529
      - 503
      - connection_error
    max_retries: 3
database:
  journal_mode: wal
agent:
  max_turns: 150
  personalities: {}
  reasoning_effort: low
  verbose: false
terminal:
  backend: local
web:
  backend: ddgs
  use_gateway: false
browser:
  backend: browser-use
  inactivity_timeout: 120
  cloud_provider: local
  executable_path: C:\Program Files\Mozilla Firefox\firefox.exe
  use_gateway: false
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  pet:
    enabled: true
    slug: nukey
  busy_ack_detail: true
  cleanup_progress: false
  long_running_notifications: true
  tool_progress: all
voice:
  auto_tts: false
wake_word:
  enabled: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  flush_min_turns: 6
  nudge_interval: 10
delegation:
  max_iterations: 250
timezone: ''
command_allowlist:
  - script execution via heredoc
  - access to Hermes secrets (Windows path)
code_execution:
  max_tool_calls: 50
  timeout: 300
onboarding:
  seen:
    busy_input_prompt: true
    openclaw_residue_cleanup: true
computer_use:
  backend: cua-driver
  delivery_mode: background
  enabled: true
_config_version: 37
