mcp_servers:
  n8n:
    args:
    - C:/Users/admin/AppData/Local/hermes/mcp-installs/n8n/server.py
    - --env
    - N8N_MCP_ENV=C:/Users/admin/.config/n8n-mcp/env
    command: C:/Users/admin/AppData/Local/hermes/hermes-agent/venv/Scripts/python.exe
    enabled: true
memory:
  flush_min_turns: 6
  memory_char_limit: 2200
  memory_enabled: true
  nudge_interval: 10
  user_char_limit: 1375
  user_profile_enabled: true
model:
  aliases:
    aion-3: aion-labs/aion-3.0
    cf-llama: cloudflare-workers-ai/@cf/meta/llama-3.3-70b-instruct-fp8-fast
    cohere-command: cohere/command-a-plus-05-2026
    gemini-flash: gemini/gemini-2.5-flash
    gemini-pro: gemini/gemini-2.5-pro
    groq-gptoss: groq/openai/gpt-oss-120b
    groq-llama: groq/llama-3.3-70b-versatile
    huggingface-llama: huggingface/meta-llama/llama-3.1-8b-instruct
    kilo-nemotron: kilo-ai/nvidia/nemotron-3-ultra-550b-a55b:free
    llm7-gptoss: llm7/gpt-oss:20b
    mistral-large: mistralai/mistral-large-3
    ollama-mistral: custom/mistral:latest
  base_url: https://api.groq.com/openai/v1
  default: openai/gpt-oss-120b
  provider: custom
model_providers:
- base_url: https://generativelanguage.googleapis.com/v1beta/openai
  description: 'Free tier: 1M context, 15 RPM, 1500 RPD. No credit card.'
  key_env: GOOGLE_API_KEY
  model: gemini-2.5-flash
  name: Google Gemini Free
  provider: googleai-studio
- base_url: https://api.groq.com/openai/v1
  description: 'Free tier: 30 RPM, 1000 RPD. Ultra-fast LPU. gpt-oss-120b also available.'
  key_env: GROQ_API_KEY
  model: llama-3.3-70b-versatile
  name: Groq Free
  provider: groq
- base_url: https://api.groq.com/openai/v1
  description: 'Free tier: 30 RPM. OpenAI GPT-OSS 120B on Groq LPU.'
  key_env: GROQ_API_KEY
  model: openai/gpt-oss-120b
  name: Groq GPT-OSS 120B
  provider: groq
- base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run
  description: 10K neurons/day free. 75+ models. No credit card.
  key_env: CLOUDFLARE_API_TOKEN
  model: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  name: Cloudflare Workers AI
  provider: cloudflare-workers-ai
- base_url: https://api.kilo.ai/api/gateway
  description: Free, no credit card. Auto-routes to free pool. ~200 req/hr.
  key_env: KILO_API_KEY
  model: nvidia/nemotron-3-ultra-550b-a55b:free
  name: Kilo AI Free
  provider: kilo-ai
- base_url: https://api.aionlabs.ai/v1
  description: 'Permanent free: 15 RPM, 20K tokens/day. Roleplay + reasoning.'
  key_env: AION_LABS_API_KEY
  model: aion-labs/aion-3.0
  name: Aion Labs Free
  provider: aion-labs
- base_url: https://api.mistral.ai/v1
  description: 'Free mode: $10/month credits. Mistral Large 3, Medium 3.5, Small 4.'
  key_env: MISTRAL_API_KEY
  model: mistral-large-3
  name: Mistral AI Free
  provider: mistralai
- base_url: https://api.cohere.com/v2
  description: 'Free trial: 1000 calls/month. Command A+ (218B). Non-commercial.'
  key_env: COHERE_API_KEY
  model: command-a-plus-05-2026
  name: Cohere Free
  provider: cohere
- base_url: https://router.huggingface.co/v1
  description: $0.10/month free credits. Routes to Fireworks, Together, Hyperbolic,
    etc.
  key_env: HF_TOKEN
  model: meta-llama/llama-3.1-8b-instruct
  name: HuggingFace Free
  provider: huggingface
- base_url: https://api.llm7.io/v1
  description: Free tier. GPT-OSS 20B reasoning model. 30 RPM (120 with token).
  key_env: LLM7_API_KEY
  model: gpt-oss:20b
  name: LLM7 Free
  provider: llm7
