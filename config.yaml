_config_version: 37
agent:
  max_turns: 150
  personalities: {}
  reasoning_effort: low
  verbose: false
browser:
  backend: browser-use
  cloud_provider: local
  executable_path: C:\Program Files\Mozilla Firefox\firefox.exe
  inactivity_timeout: 120
  use_gateway: false
code_execution:
  max_tool_calls: 50
  timeout: 300
command_allowlist:
- script execution via heredoc
- access to Hermes secrets (Windows path)
compression:
  codex_app_server_auto: native
  codex_gpt55_autoraise: true
  codex_responses_compact_threshold: 200000
  codex_responses_native: false
  enabled: true
  idle_compact_after_seconds: 0
  max_attempts: 3
  min_tail_user_messages: 1
  proactive_prune_min_reclaim_tokens: 4096
  proactive_prune_min_result_chars: 8000
  proactive_prune_tokens: 0
  progress_notices: false
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.2
  threshold: 0.5
computer_use:
  backend: cua-driver
  delivery_mode: background
  enabled: true
custom_providers:
- api_mode: chat_completions
  base_url: https://api.groq.com/openai/v1
  key_env: GROQ_API_KEY
  model: openai/gpt-oss-120b
  models:
  - openai/gpt-oss-120b
  - qwen/qwen3.6-27b
  - openai/gpt-oss-20b
  - groq/compound
  name: Groq Cloud
- api_mode: chat_completions
  base_url: https://api.cloudflare.com/client/v4/accounts/0e7abc95ba8de4bd3251dd919362a383/ai/v1
  key_env: CLOUDFLARE_API_TOKEN
  model: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  models:
  - '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  - '@cf/deepseek-ai/deepseek-r1-distill-qwen-32b'
  name: Cloudflare AI
- api_mode: chat_completions
  base_url: http://localhost:11434/v1
  key_env: OLLAMA_API_KEY
  model: hermes3:3b
  models:
  - hermes3:3b
  - mistral:latest
  name: Ollama Local
database:
  journal_mode: wal
delegation:
  max_iterations: 250
display:
  background_process_notifications: concise
  bell_on_complete: false
  busy_ack_detail: true
  busy_input_mode: interrupt
  cleanup_progress: false
  compact: false
  interim_assistant_messages: true
  long_running_notifications: true
  pet:
    enabled: true
    slug: nukey
  show_reasoning: true
  skin: default
  streaming: true
  tool_progress: all
fallback_chain:
- label: Groq Free - Fast
  model: llama-3.3-70b-versatile
  provider: groq
- label: Gemini Free - 1M context
  model: gemini-2.5-flash
  provider: googleai-studio
- label: Mistral Free - $10/mo
  model: mistral-large-3
  provider: mistralai
- label: Ollama Local
  model: mistral:latest
  provider: custom-provider
fallback_providers:
- base_url: http://localhost:11434
  key_env: HERMES_CUSTOM_LOCALHOST_11434_API_KEY
  max_retries: 3
  model: mistral:latest
  provider: Mistral Local
  trigger_on:
  - 429
  - 529
  - 503
  - connection_error
fallbacks:
- base_url: https://api.groq.com/openai/v1
  model: qwen/qwen3.6-27b
  provider: custom
- base_url: https://inference-api.nousresearch.com/v1
  model: upstage/solar-pro4:free
  provider: nous
- base_url: https://api.cloudflare.com/client/v4/accounts/0e7abc95ba8de4bd3251dd919362a383/ai/v1
  model: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
  provider: custom
- base_url: http://localhost:11434/v1
  model: hermes3:3b
  provider: custom
- base_url: http://localhost:11434/v1
  model: mistral:latest
  provider: custom
group_sessions_per_user: true
